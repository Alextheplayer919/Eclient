name: OxClient APK Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write        # the playtest release step publishes the signed APK

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin', cache: gradle }
      - run: chmod +x gradlew

      # ── relay/Protocol artık repoya gömülü (vendor_protocol.yml ile
      # bir kere commit'lendi) — her build'de tekrar clone YOK.
      # Sadece varlığını doğruluyoruz. ─────────────────────────────────
      - name: relay/Protocol varlığını doğrula
        run: |
          if [ ! -f "relay/Protocol/settings.gradle.kts" ]; then
            echo "!! relay/Protocol bulunamadı — vendor_protocol.yml workflow'unu çalıştırdın mı?"
            exit 1
          fi
          echo "relay/Protocol mevcut ✓"
          find relay/Protocol -maxdepth 1 -type d

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx4g"

      # ── TEŞHİS ADIMI — composite build (includeBuild) kullanıldığı için
      # jar artık ~/.gradle/caches'e değil, relay/Protocol/bedrock-codec/
      # build/libs/ altına düşüyor. ──────────────────────────────────────
      - name: Diagnose bedrock-codec (composite build çıktısı)
        if: always()
        run: |
          echo "── relay/Protocol/bedrock-codec build çıktıları ──"
          find relay/Protocol/bedrock-codec -path "*/build/libs/*.jar" -exec ls -la {} \;

          echo ""
          echo "── Kaynak ağacında hangi Bedrock_vXXX sınıfları var (derlemeden bağımsız gerçek liste) ──"
          find relay/Protocol/bedrock-codec -iname "Bedrock_v*.java" -o -iname "Bedrock_v*.kt" | sed -E 's#.*Bedrock_v([0-9]+)\.(java|kt)#\1#' | sort -n -u

          echo ""
          echo "════════════════════════════════════════════════════════"
          echo "── HEDEF SÜRÜM: 1.21.111 = protocol 844 (attach ile  ──"
          echo "── aynı build: sha256 69f6584c…). Bu YOK ise oyun    ──"
          echo "── 1.21.111 ile relay'e bağlanamaz.                  ──"
          echo "════════════════════════════════════════════════════════"
          for v in 819 827 844 859 860 897; do
            if find relay/Protocol/bedrock-codec -iname "Bedrock_v${v}.*" | grep -q .; then
              echo "  [VAR]  v${v}"
            else
              echo "  [YOK]  v${v}"
            fi
          done
          echo ""
          echo "── assets (definition dosyaları, 844 için şart) ──"
          for f in app/src/main/assets/nbt/block_palette_v844.nbt app/src/main/assets/nbt/runtime_item_statesv844.json; do
            if [ -f "$f" ]; then echo "  [VAR]  $f ($(stat -c%s "$f") bytes)"; else echo "  [YOK]  $f"; fi
          done

          echo ""
          echo "════════════════════════════════════════════════════════"
          echo "── KRİTİK KONTROL: 2b2tpe.org protocol=944 istiyor.     ──"
          echo "════════════════════════════════════════════════════════"
          for v in 898 924 935 944 948 975; do
            if find relay/Protocol/bedrock-codec -iname "Bedrock_v${v}.*" | grep -q .; then
              echo "  [VAR]  v${v}"
            else
              echo "  [YOK]  v${v}"
            fi
          done

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OxClient-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Decode keystore
        if: github.ref == 'refs/heads/main'
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > app/release.jks
      - name: Debug keystore checksum
        if: github.ref == 'refs/heads/main'
        run: md5sum app/release.jks
      - name: Build Release APK
        if: github.ref == 'refs/heads/main'
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/release.jks
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
      - name: Upload Release APK
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: OxClient-release-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      # ── Oynanabilir indirme linki ────────────────────────────────────────
      # Artifact'lar giriş istiyor ve süresi doluyor; playtest için sabit bir
      # tag'e imzalı release APK'sını bırakıyoruz. Her main build'inde üzerine
      # yazar (--clobber), yani link hep aynı kalır:
      #   https://github.com/Alextheplayer919/Eclient/releases/download/
      #     playtest-1.21.111/Eclient-playtest-1.21.111.apk
      - name: Publish playtest release (stable download link)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          set -e
          TAG="playtest-1.21.111"
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          # Stage under the final name: gh's file#name rename does not always
          # take, and the download link must be stable and readable.
          STAGE="$(mktemp -d)/Eclient-playtest-1.21.111.apk"
          cp "$APK" "$STAGE"
          echo "publishing $APK -> Eclient-playtest-1.21.111.apk ($(stat -c%s "$STAGE") bytes)"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Eclient playtest — Minecraft 1.21.111 (protocol 844)" \
              --notes "Signed release APK for the 1.21.111 target. Refreshed on every main build; the download link never changes.  \n\nInstall over any previous playtest build: same signature, so config survives.  \n\nStock Minecraft 1.21.111 + this app = proxy mode (relay on 127.0.0.1:19150, advertised on LAN as 'rubidium'). See docs/PLAYTEST.md."
          fi
          gh release upload "$TAG" "$STAGE" --clobber
          echo "── assets now ──"
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)  \(.size) bytes"'
