name: Attach Probe Build (experiment)

on:
  push:
    branches: [ attach-experiment ]
    paths:
      - 'attach/**'
      - '.github/workflows/attach_build.yml'
  workflow_dispatch:

jobs:
  build-attach-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate NDK toolchain (bundled with ubuntu-latest runner)
        id: ndk
        run: |
          ROOT="${ANDROID_NDK_LATEST_HOME:-}"
          if [ -z "$ROOT" ] && [ -n "${ANDROID_HOME:-}" ]; then
            ROOT="$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1 || true)"
          fi
          if [ -z "$ROOT" ]; then
            echo "No Android NDK found on runner"; exit 1
          fi
          echo "ndk=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Using NDK: $ROOT"

      - name: Configure CMake (arm64-v8a)
        run: |
          cmake -S attach -B attach/build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.ndk.outputs.ndk }}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build module
        run: cmake --build attach/build -v

      - name: Upload .levipack artifact
        uses: actions/upload-artifact@v4
        with:
          name: eclient_attach-levipack
          path: |
            attach/build/*.levipack
            attach/build/libeclient_attach.so
          if-no-files-found: error
